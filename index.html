<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="error-container">
        <!-- Text Content -->
        <article class="content-section">
            <span class="error-code" aria-hidden="true">404</span>
            <h1 class="title">Page not found</h1>
            <p class="description">Oops! It looks like the page you're looking for has been moved, deleted, or never existed.</p>
            
            <div class="action-wrapper">
                <a href="/" class="magnetic-btn" aria-label="Return to the homepage">
                    <span class="btn-text">Return Home</span>
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                </a>
            </div>
        </article>

        <!-- Visual Content -->
        <aside class="visual-section" aria-hidden="true">
            <div class="illustration-wrapper">
                <img src="404.png" alt="Illustration of a confused person indicating a 404 error" class="illustration" />
            </div>
        </aside>
    </main>

    <script src="script.js"></script>
</body>
</html>
